rules:
  - id: go.core.no-global-mutable-state
    patterns:
      - pattern: |
          var $X = ...
      # Semgrep's Go matcher normalizes const declarations into the same shape
      # as `var $X = ...`, so a bare var-pattern false-fires on immutable const
      # decls (e.g. `Foo SomeType = iota`). const is immutable by language
      # definition and is never the mutable-global hazard this rule targets;
      # exclude both untyped and typed const forms. (Proven purely subtractive:
      # all real `var` globals still flag; only const false-positives drop.)
      - pattern-not: |
          const $X = $Y
      - pattern-not: |
          const $X $T = $Y
      # regexp.MustCompile-initialized package vars are immutable-by-construction:
      # compiled once at init, never reassigned, and *regexp.Regexp is documented as
      # safe for concurrent use — NOT the mutable-global hazard this rule targets.
      # Complying (recompile per-call, or thread the regexp through via DI) is strictly
      # worse code. Purely subtractive: real mutable `var` globals still flag.
      - pattern-not: |
          var $X = regexp.MustCompile(...)
      - pattern-not: |
          var $X = regexp.MustCompilePOSIX(...)
      # Package scope only. The bare var-pattern also matches `var` inside a
      # function body (including methods and closures); a local variable is not
      # package-level state. Purely subtractive: every package-level match stands.
      - pattern-not-inside: |
          func $F(...) { ... }
      - pattern-not-inside: |
          func $F(...) $R { ... }
      - pattern-not-inside: |
          func ($RECV $T) $F(...) { ... }
      - pattern-not-inside: |
          func ($RECV $T) $F(...) $R { ... }
      - pattern-not-inside: |
          func(...) { ... }
      - pattern-not-inside: |
          func(...) $R { ... }
      # `var _ I = (*T)(nil)` is a compile-time interface assertion: the blank
      # identifier stores nothing that any code can read or write.
      - pattern-not: |
          var _ $T = $V
      - pattern-not: |
          var _ = $V
      # embed.FS is read-only by type: a typed re-export of an embedded
      # filesystem (`var SchemaFS embed.FS = root.SchemaFS`) exposes no mutable
      # state, like the regexp.MustCompile case above.
      - pattern-not: |
          var $X embed.FS = $V
    message: "Package-level mutable variable detected. Use dependency injection instead."
    severity: ERROR
    languages: [go]
    # Test files are excluded, as for go.core.no-ignored-errors (1.2.1). The
    # rule's hazard is runtime state reached without dependency injection. A test
    # package's top-level vars are fixtures (a fixed clock, an expected-hash
    # table), and the only way to satisfy the rule there is a constructor
    # function per fixture. Measured on backstop-core 2026-11-01: 6 package-level
    # test-file matches, none ever written. go-003-fixture-in-test_test.go pins
    # the exclusion.
    paths:
      exclude:
        - "*_test.go"
    metadata:
      backstop:
        category: structure
        rule_id: GO-003
        compliance_tier: baseline
        rationale: "Global mutable state makes testing and reasoning about code difficult"

  - id: go.core.no-init-functions
    pattern: |
      func init() {
        ...
      }
    message: "Avoid init() side effects. Prefer explicit initialization via constructors."
    severity: ERROR
    languages: [go]
    metadata:
      backstop:
        category: structure
        rule_id: GO-004
        compliance_tier: baseline
        rationale: "Explicit initialization improves startup ordering and testability."

  - id: go.core.constructor-injection
    patterns:
      - pattern: |
          $TYPE{
            $FIELD: $VALUE,
            ...
          }
      - metavariable-regex:
          metavariable: $FIELD
          regex: (?i).*(repo|client|store|db|database|cache|logger|service|gateway|adapter|provider).*
      - pattern-not: |
          $TYPE{}
    message: "Direct struct wiring detected. Prefer constructor-based dependency injection."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: structure
        rule_id: GO-005
        compliance_tier: standard
        rationale: "Constructor injection clarifies dependencies and improves testability."

  - id: go.core.structured-logging
    pattern-either:
      - pattern: log.Print(...)
      - pattern: log.Printf(...)
      - pattern: log.Println(...)
      - pattern: log.Fatal(...)
      - pattern: log.Fatalf(...)
      - pattern: log.Fatalln(...)
    message: "Use structured logging APIs (zap/slog) instead of stdlib log.Print/Fatal."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: structure
        rule_id: GO-006
        compliance_tier: standard
        rationale: "Structured logs are machine-parseable and support consistent observability."

  # The pattern matches a DISCARDED SECOND VALUE, not a discarded ERROR — semgrep
  # cannot see the type behind `_`. In non-test code that approximation holds well
  # enough, because a `$VAL, _ :=` there is overwhelmingly an error being dropped.
  # In TEST code it does not: test helpers routinely return (value, value) pairs
  # whose second element is not an error at all, so the rule fires on code with no
  # error to handle, and the only ways to satisfy it are a suppression comment or a
  # throwaway variable — scars written for a rule that misfired.
  #
  # Measured on backstop-core 2026-07-27 (ISSUE-087 TASK-016): 97 rows across 21
  # test files, 61 distinct source lines. Non-error discards in that set include
  # `code, _ := runArtifactNewTest(...)` — signature (int, string), no error in it
  # — and `result, _ := g.Run(ctx)`, where gate.Run returns (GateResult, int) and
  # the discarded value is an exit code.
  #
  # Excluding test files is PURELY SUBTRACTIVE: this rule's own fixture pair
  # (go-010-error-handled.go / go-010-ignored-error.go) is plain .go and behaves
  # identically, every real non-test ignored error still flags, and
  # go-010-ignored-error-in-test_test.go pins the new exclusion so it cannot
  # silently regress. Genuine unchecked errors in tests remain covered by the
  # go-toolchain pack's errcheck pass, which knows the actual types. Mirrors the
  # paths-scoping convention already used by go.test.no-time-sleep-in-tests.
  - id: go.core.no-ignored-errors
    pattern-either:
      - pattern: |
          $VAL, _ := $FUNC(...)
      - pattern: |
          _, _ = $FUNC(...)
    message: "Ignored error detected. Handle returned errors explicitly."
    severity: ERROR
    languages: [go]
    paths:
      exclude:
        - "*_test.go"
    metadata:
      backstop:
        category: error-handling
        rule_id: GO-010
        compliance_tier: baseline
        rationale: "Ignoring errors causes silent failures and obscures root causes."

  - id: go.core.error-wrapping-required
    patterns:
      - pattern-inside: |
          func $FUNC(...) (..., error) {
            ...
          }
      - pattern: |
          if $ERR != nil {
            return ..., $ERR
          }
    message: "Return wrapped errors with context using fmt.Errorf(\"...: %w\", err)."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: error-handling
        rule_id: GO-011
        compliance_tier: standard
        rationale: "Error wrapping preserves cause chains while adding diagnostic context."
        note: "Pattern requires explicit (..., error) return signature; functions returning error in non-trailing position or via named returns may not be matched."

  - id: go.core.no-naked-returns
    pattern: |
      func $NAME(...) (...) {
        ...
        return
      }
    message: "Avoid naked returns in non-trivial functions; return explicit values."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: error-handling
        rule_id: GO-012
        compliance_tier: standard
        rationale: "Explicit returns improve readability and reduce ambiguity."
        note: "Semgrep cannot enforce GO-012's function-length constraint; native analysis is still required for line-count thresholding."

  - id: go.core.no-panic-in-library-code
    patterns:
      - pattern: panic(...)
      - pattern-not-inside: |
          func main(...) {
            ...
          }
    message: "panic() in library code is forbidden; return errors to the caller."
    severity: ERROR
    languages: [go]
    metadata:
      backstop:
        category: error-handling
        rule_id: GO-013
        compliance_tier: baseline
        rationale: "Library panics crash callers and bypass normal error handling."

  - id: go.core.error-type-suffix
    pattern-regex: "(?s)type\\s+\\w+(?<!Error)\\s+struct\\s*\\{.*?\\}\\s*func\\s*\\([^\\)]*\\)\\s*Error\\s*\\("
    message: "Custom error types should end with the Error suffix."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: naming
        rule_id: GO-021
        compliance_tier: standard
        rationale: "Error suffixes make error types discoverable and idiomatic."
